services:
  postgres:
    image: postgres:16
    container_name: physique-meter-postgres
    environment:
      POSTGRES_DB: physique_meter
      POSTGRES_USER: physique
      POSTGRES_PASSWORD: physique
    ports:
      - "5432:5432"
    volumes:
      - physique_postgres:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  physique_postgres:
